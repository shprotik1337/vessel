name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Версия релиза (например 1.0.0)
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Сверка версии
        shell: pwsh
        run: |
          $tauri = Get-Content "apps/vessel-gui/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($tauri.version -ne $env:PACKAGE_VERSION) {
            throw "tauri.conf.json содержит $($tauri.version), ожидалась $env:PACKAGE_VERSION"
          }

      - name: Тесты
        run: cargo test --lib --locked -j 2
      - name: Тесты vessel-server
        run: cargo test -p vessel-server --locked -j 2

      - name: Зависимости GUI
        working-directory: apps/vessel-gui
        run: npm ci

      - name: Сборка installer
        working-directory: apps/vessel-gui
        run: npm run tauri build

      - name: Проверка артефакта
        shell: pwsh
        run: |
          $path = "target/release/bundle/nsis/Vessel_${env:PACKAGE_VERSION}_x64-setup.exe"
          if (-not (Test-Path $path)) { throw "installer не найден: $path" }
          "{0:N1} MB" -f ((Get-Item $path).Length / 1MB)

      - name: Публикация в Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Vessel ${{ inputs.version }}
          body: |
            ## Vessel ${{ inputs.version }}

            Установщик Windows (NSIS). Запусти `Vessel_${{ inputs.version }}_x64-setup.exe` и следуй шагам установщика.

            ### Требования
            - Windows 10/11 x64
            - WebView2 Runtime (предустановлен в Windows 11, [скачать для Windows 10](https://developer.microsoft.com/en-us/microsoft-edge/webview2/))
          files: |
            target/release/bundle/nsis/Vessel_${{ inputs.version }}_x64-setup.exe
          draft: false
          prerelease: false
