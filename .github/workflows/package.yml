name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Версия релиза (например 1.0.0)
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: write

env:
  AMNEZIA_BOX_REF: v1.260910.0

jobs:
  vpn-core:
    name: VPN core (amnezia-box)
    runs-on: windows-latest
    steps:
      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"

      - name: Загрузка amnezia-box
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amnezia-box
          ref: ${{ env.AMNEZIA_BOX_REF }}
          persist-credentials: false

      - name: Сборка ядра
        shell: pwsh
        run: |
          $env:GOTOOLCHAIN = "local"
          $env:GOWORK = "off"
          $tags = "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_awg"
          go build -trimpath -tags $tags `
            -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=$env:AMNEZIA_BOX_REF" `
            -o amnezia-box.exe ./cmd/sing-box
          if (-not (Test-Path "amnezia-box.exe")) { throw "ядро не собралось" }
          & .\amnezia-box.exe version

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: vpn-core
          path: amnezia-box.exe
          retention-days: 1
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: vpn-core
    runs-on: windows-latest
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Загрузка ядра VPN
        uses: actions/download-artifact@v4
        with:
          name: vpn-core
          path: apps/vessel-gui/src-tauri/resources/vpn

      - name: Сверка версии
        shell: pwsh
        run: |
          $tauri = Get-Content "apps/vessel-gui/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($tauri.version -ne $env:PACKAGE_VERSION) {
            throw "tauri.conf.json содержит $($tauri.version), ожидалась $env:PACKAGE_VERSION"
          }
          if (-not (Test-Path "apps/vessel-gui/src-tauri/resources/vpn/amnezia-box.exe")) {
            throw "ядро VPN не найдено в ресурсах"
          }

      - name: Тесты
        run: cargo test --lib --locked -j 2
      - name: Тесты vessel-server
        run: cargo test -p vessel-server --locked -j 2

      - name: Зависимости GUI
        working-directory: apps/vessel-gui
        run: npm ci

      - name: Сборка installer
        working-directory: apps/vessel-gui
        run: npm run tauri build

      - name: Проверка артефакта
        shell: pwsh
        run: |
          $path = "target/release/bundle/nsis/Vessel_${env:PACKAGE_VERSION}_x64-setup.exe"
          if (-not (Test-Path $path)) { throw "installer не найден: $path" }
          "{0:N1} MB" -f ((Get-Item $path).Length / 1MB)

      - name: Portable-архив
        shell: pwsh
        run: |
          $dir = "target/release/portable/Vessel"
          New-Item -ItemType Directory -Force "$dir/vpn" | Out-Null
          Copy-Item "target/release/vessel.exe" $dir
          Copy-Item "apps/vessel-gui/src-tauri/resources/vpn/amnezia-box.exe" "$dir/vpn/"
          New-Item -ItemType Directory -Force "target/release/bundle/portable" | Out-Null
          Compress-Archive -Path "$dir/*" -DestinationPath "target/release/bundle/portable/Vessel_${env:PACKAGE_VERSION}_x64-portable.zip" -Force
          "portable: {0:N1} MB" -f ((Get-Item "target/release/bundle/portable/Vessel_${env:PACKAGE_VERSION}_x64-portable.zip").Length / 1MB)

      - name: Публикация в Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Vessel ${{ inputs.version }}
          body: |
            ## Vessel ${{ inputs.version }}

            Установщик Windows (NSIS). Запусти `Vessel_${{ inputs.version }}_x64-setup.exe` и следуй шагам установщика.

            **Portable**: распакуй `Vessel_${{ inputs.version }}_x64-portable.zip` в любую папку и запусти `Vessel.exe` — рядом должны лежать папка `vpn` с ядром.

            ### Требования
            - Windows 10/11 x64
            - WebView2 Runtime (предустановлен в Windows 11, [скачать для Windows 10](https://developer.microsoft.com/en-us/microsoft-edge/webview2/))
          files: |
            target/release/bundle/nsis/Vessel_${{ inputs.version }}_x64-setup.exe
            target/release/bundle/portable/Vessel_${{ inputs.version }}_x64-portable.zip
          draft: false
          prerelease: false
