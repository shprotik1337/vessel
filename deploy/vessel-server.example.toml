# Пример Vessel Server. Скопируй на сервере:
#   cp deploy/vessel-server.example.toml /opt/vessel/server.toml
# Сгенерируй токен:  openssl rand -hex 24   (или pwgen)
# Запуск:           vessel-server /opt/vessel/server.toml
# systemd unit:     deploy/vessel-server.service

[server]
name = "My Vessel Server"
listen = "0.0.0.0:7700"
# HTTPS termination is out of scope for alpha: put caddy/nginx in front if tokens
# must not cross public internet.
tokens = ["REPLACE-ME-long-random-hex"]

# auto — через сервер идёт только то, что иначе не заиграет с клиентского IP
# (googlevideo, расшифрованные файлы). always — весь аудио-трафик через сервер.
# off — relay запрещён (только метаданные/URL, провайдеры с file:// не отдадутся).
relay = "auto"
max_streams = 64
# TTL relay-токенов, сек (аудиосессии живут часами — ставь с запасом)
relay_ttl_secs = 14400
data_dir = "/opt/vessel"

# Сервер НЕ хранит аккаунтов: каждый запрос работает под учётными данными
# клиента (заголовок x-vessel-credentials: sp_dc, ARL, OAuth-токен и т.д.).
# Здесь только флаги, какие провайдеры включены на сервере.
soundcloud_enabled = true
yandex_enabled = false
deezer_enabled = false
spotify_enabled = true
youtube_music_enabled = true

# --- YouTube Music на сервере ---------------------------------------------
# YTM на датацентровых IP без логина режется Google: поиск пустой, стримы
# обрезаются до ~1 MiB. Вместо серверной cookie (которой больше нет) клиент
# передаёт свою cookie/refresh_token в x-vessel-credentials. Дополнительно
# можно держать bgutil-совместимый HTTP-провайдер PO token на той же машине
# (127.0.0.1:4416) — токен привязан к IP выхода.
youtube_potoken_provider = "http://127.0.0.1:4416"

# после старта:
# curl -H "Authorization: Bearer <токен>" http://127.0.0.1:7700/api/v1/capabilities
