[workspace]
members = ["apps/vessel-gui/src-tauri"]
resolver = "2"

[package]
name = "vessel-core"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Vessel — музыкальный клиент (ядро)"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
cpal = "0.18"
crossbeam-channel = "0.5"
directories = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
hex = "0.4"
keyring = "4"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "cookies", "json", "query", "rustls"] }
resvg = { version = "0.47", default-features = false }
rusqlite = { version = "0.37", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
brotli = "7"
rustypipe-botguard = "0.1.2"
hmac = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util", "process", "fs"] }
toml = "0.9"
symphonia = { version = "0.6", default-features = false, features = ["aac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
yandex-music = "0.4.8"
zeroize = "1"
blowfish = "0.9"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
md5 = "0.7"
aes = "0.8"
open = "5"
librespot-core = "0.8"
librespot-audio = "0.8"
librespot-oauth = "0.8"
librespot-protocol = "0.8"
protobuf = "3"
vergen = "=9.0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
env_logger = "0.11"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
overflow-checks = false
# Инкрементальная компиляция в release раздувает target на гигабайты —
# release собирается редко и целиком, кэш не нужен.
incremental = false






[patch.crates-io]
v8 = { path = "vendor/v8" }


