[package]
name = "vessel-server"
version = "0.2.0"
description = "Vessel Server — remote-обработчик провайдеров для клиента Vessel"
edition = "2024"

[[bin]]
name = "vessel-server"
path = "src/main.rs"

[dependencies]
vessel-core = { path = "../.." }
anyhow = "1"
axum = { version = "0.8", features = ["json", "query", "macros"] }
futures-util = "0.3"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4"] }
